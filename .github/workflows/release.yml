name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: writename: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build and Test
      working-directory: AIReplyKeyboard
      run: gradle testDebugUnitTest assembleDebug

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.0
        files: AIReplyKeyboard/app/build/outputs/apk/debug/app-debug.apk

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and Test
        working-directory: AIReplyKeyboard
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          files: AIReplyKeyboard/app/build/outputs/apk/debug/app-debug.apk
